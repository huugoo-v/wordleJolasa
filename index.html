<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wordle</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>

  <body>
    <div class="contenedor">
      <label for="intentos">Intentos</label>

      <select id="intentos">
        <option value="4">4</option>
        <option value="5" selected>5</option>
        <option value="6">6</option>
        <option value="7">7</option>
      </select>

      <label for="letras">Nº de letras</label>

      <select id="letras">
        <option value="4">4</option>
        <option value="5" selected>5</option>
        <option value="6">6</option>
        <option value="7">7</option>
      </select>

      <button id="jugar">Jugar</button>
    </div>

    <div class="juegoBloque">
      <div class="tablero" id="tablero"></div>
    </div>

    <!-- TECLADO -->
    <div class="teclado">
      <div class="fila filaTildes">
        <button>Á</button>
        <button>É</button>
        <button>Í</button>
        <button>Ó</button>
        <button>Ú</button>
      </div>

      <div class="fila">
        <button>Q</button>
        <button>W</button>
        <button>E</button>
        <button>R</button>
        <button>T</button>
        <button>Y</button>
        <button>U</button>
        <button>I</button>
        <button>O</button>
        <button>P</button>
      </div>

      <div class="fila">
        <button>A</button>
        <button>S</button>
        <button>D</button>
        <button>F</button>
        <button>G</button>
        <button>H</button>
        <button>J</button>
        <button>K</button>
        <button>L</button>
        <button>Ñ</button>
      </div>

      <div class="fila">
        <button id="enter">Enter</button>

        <button>Z</button>
        <button>X</button>
        <button>C</button>
        <button>V</button>
        <button>B</button>
        <button>N</button>
        <button>M</button>

        <button id="del">DEL</button>
      </div>
    </div>

    <div id="alerta" class="alerta">
      <div class="alertaContenido">
        <h2 id="mensajeAlerta"></h2>
        <button id="reiniciar">Volver a jugar</button>
      </div>
    </div>

    <script src="/js/index.js"></script>
  </body>
</html>
